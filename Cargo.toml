[package]
name = "slateamp"
version = "0.9.0"
edition = "2021"
license = "MIT"
description = "A compact Winamp-inspired GTK4 music and internet radio player"

[dependencies]
anyhow = "1.0"
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11" }
gst = { package = "gstreamer", version = "0.25" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
